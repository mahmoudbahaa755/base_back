version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: admin_platform_postgres
    environment:
      POSTGRES_DB: admin_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - admin_platform_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: admin_platform_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - admin_platform_network

  # Kafka (with Zookeeper)
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: admin_platform_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - admin_platform_network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: admin_platform_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - admin_platform_network

  # Kafka UI for development
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: admin_platform_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - admin_platform_network

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4
    container_name: admin_platform_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - admin_platform_network

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  pgadmin_data:

networks:
  admin_platform_network:
    driver: bridge